<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7; --surface: #FFFFFF; --border: #E1E4EA; --text: #1C2130;
    --text-muted: #6B7280; --indigo: #454B8C; --indigo-dark: #363B70;
    --amber: #E2A33B; --amber-dark: #C48A28; --ai-bubble: #EFF0F5;
    --ref-bg: #FBF6E9; --ref-border: #EAD9A8;
    --green: #3F9A5C; --red: #C9503F;
  }
  [data-theme="dark"] {
    --bg: #14151C; --surface: #1B1D28; --border: #2C2F3D; --text: #E7E8ED;
    --text-muted: #8B8FA3; --indigo: #7B82C9; --indigo-dark: #9298D6;
    --amber: #E8B85C; --amber-dark: #F2C878; --ai-bubble: #232532;
    --ref-bg: #26251C; --ref-border: #453D24;
    --green: #4CAE6E; --red: #DB6B5A;
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .app {
    width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column;
    background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; background: var(--indigo);
    color: white; display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', serif; font-weight: 600; font-size: 15px; flex-shrink: 0;
  }
  header h1 { font-family: 'Lora', serif; font-style: italic; font-weight: 600; font-size: 19px; margin: 0; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .theme-toggle {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .theme-toggle:hover { color: var(--text); }
  .theme-toggle svg { width: 16px; height: 16px; }
  .mode-toggle { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .mode-btn {
    border: none; background: transparent; padding: 6px 9px; font-size: 12px;
    font-weight: 500; color: var(--text-muted); border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
    font-family: inherit;
  }
  .mode-btn svg { width: 13px; height: 13px; }
  .mode-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .mode-btn:hover { color: var(--text); }

  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  #user-name { font-weight: 600; color: var(--text); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #logout-btn {
    border: 1px solid var(--border); background: var(--bg); color: var(--text-muted);
    padding: 5px 9px; font-size: 12px; font-family: inherit; border-radius: 7px; cursor: pointer;
  }
  #logout-btn:hover { color: var(--text); border-color: var(--indigo); }

  /* ----- login / signup screen ----- */
  #auth-screen {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  .auth-card { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .auth-title { font-family: 'Lora', serif; font-style: italic; font-weight: 600; font-size: 24px; margin: 0; }
  .auth-sub { margin: 0; font-size: 14px; color: var(--text-muted); line-height: 1.5; }
  .auth-tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; }
  .auth-tabs .mode-btn { flex: 1; padding: 8px 9px; font-size: 13px; }
  .auth-input {
    width: 100%; padding: 11px 12px; font-size: 14px; font-family: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; outline: none;
  }
  .auth-input:focus { border-color: var(--indigo); }
  .auth-hint { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .auth-error { min-height: 18px; margin: 0; font-size: 13px; color: var(--red); line-height: 1.4; }
  .auth-submit {
    background: var(--amber); color: #4A3200; border: none; padding: 12px 18px;
    font-size: 14px; font-weight: 600; font-family: inherit; border-radius: 10px; cursor: pointer;
  }
  .auth-submit:hover { background: var(--amber-dark); }
  .auth-submit:disabled { opacity: 0.5; cursor: default; }
  .field-group { display: flex; flex-direction: column; }

  /* ----- main app ----- */
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted); text-align: center; gap: 8px; padding: 40px 20px;
  }
  .empty-state svg { width: 32px; height: 32px; opacity: 0.5; margin-bottom: 4px; }
  .empty-state p { margin: 0; font-size: 14px; max-width: 260px; line-height: 1.5; }

  .row { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .row.user-row { justify-content: flex-end; }
  .avatar {
    width: 26px; height: 26px; border-radius: 7px; background: var(--indigo); color: white;
    font-family: 'Lora', serif; font-weight: 600; font-size: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
  }
  .msg {
    max-width: 74%; padding: 10px 14px; font-size: 15px; line-height: 1.55; white-space: pre-wrap;
    animation: rise 0.22s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .user-msg { background: var(--indigo); color: white; border-radius: 14px 14px 3px 14px; }
  .ai-msg { background: var(--ai-bubble); color: var(--text); border-radius: 14px 14px 14px 3px; }

  .reference {
    align-self: flex-start; margin-left: 34px; margin-top: 2px; max-width: 72%;
    background: var(--ref-bg); border: 1px solid var(--ref-border); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; color: var(--text-muted); display: flex; gap: 6px; align-items: flex-start;
  }
  .reference svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 1px; color: var(--amber-dark); }

  .typing-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .typing-dots { display: flex; gap: 3px; padding: 10px 14px; background: var(--ai-bubble); border-radius: 14px 14px 14px 3px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  #subject-row, #quiz-options-row {
    max-height: 0; overflow: hidden; opacity: 0; padding: 0 20px;
    transition: max-height 0.2s ease, opacity 0.2s ease, padding 0.2s ease;
  }
  #subject-row.visible, #quiz-options-row.visible { max-height: 90px; opacity: 1; padding: 12px 20px 0; }
  #quiz-options-row.visible { display: flex; gap: 12px; }
  .quiz-option-field { flex: 1; }
  #subject-input, #quiz-difficulty, #quiz-count {
    width: 100%; padding: 10px 12px; font-size: 13px; font-family: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px; outline: none;
  }
  #subject-input:focus, #quiz-difficulty:focus, #quiz-count:focus { border-color: var(--indigo); }
  .field-label {
    display: block; font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px;
  }

  .quiz-card {
    align-self: stretch; background: var(--ai-bubble); border-radius: 14px; padding: 16px;
    margin-top: 10px; display: flex; flex-direction: column; gap: 16px; animation: rise 0.22s ease;
  }
  .quiz-question-text { margin: 0 0 8px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .quiz-options { display: flex; flex-direction: column; gap: 6px; }
  .quiz-option {
    text-align: left; padding: 9px 12px; font-size: 14px; font-family: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .quiz-option:hover:not(:disabled) { border-color: var(--indigo); }
  .quiz-option.selected { border-color: var(--indigo); background: var(--indigo); color: white; }
  .quiz-option.correct { border-color: var(--green); background: var(--green); color: white; }
  .quiz-option.incorrect { border-color: var(--red); background: var(--red); color: white; }
  .quiz-option:disabled { cursor: default; }
  .quiz-submit-btn {
    align-self: flex-start; background: var(--amber); color: #4A3200; border: none;
    padding: 9px 18px; font-size: 13px; font-weight: 600; border-radius: 9px; cursor: pointer;
  }
  .quiz-submit-btn:hover { background: var(--amber-dark); }
  .quiz-score { font-size: 15px; font-weight: 700; color: var(--indigo); }

  .progress-card {
    align-self: stretch; background: var(--ai-bubble); border-radius: 14px; padding: 16px;
    margin-top: 10px; display: flex; flex-direction: column; gap: 14px; animation: rise 0.22s ease;
  }
  .progress-title { margin: 0; font-size: 14px; font-weight: 600; }
  .progress-hint { margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .progress-item-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; }
  .progress-subject { font-weight: 600; }
  .progress-percent { font-size: 13px; color: var(--text-muted); }
  .progress-track { height: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; width: 0; transition: width 0.5s ease; }
  .progress-fill.weak { background: var(--red); }
  .progress-fill.okay { background: var(--amber); }
  .progress-fill.strong { background: var(--green); }
  .progress-status { margin-top: 4px; font-size: 12px; color: var(--text-muted); }

  form#input-form { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); }
  #question-input {
    flex: 1; padding: 12px 14px; font-size: 15px; font-family: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  #question-input:focus { border-color: var(--indigo); }
  #send-btn {
    background: var(--amber); color: #4A3200; border: none; padding: 0 18px;
    font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #send-btn svg { width: 15px; height: 15px; }
  #send-btn:hover { background: var(--amber-dark); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 480px) {
    .app { border: none; }
    .msg { max-width: 86%; }
    .reference { max-width: 80%; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app logged-out" id="app-root">
  <header>
    <div class="brand">
      <div class="brand-mark">S</div>
      <h1>StudyMate</h1>
    </div>
    <div class="header-right">
      <div class="mode-toggle hidden" id="mode-toggle">
        <button class="mode-btn active" id="chat-mode-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Chat
        </button>
        <button class="mode-btn" id="summarize-mode-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          Summarize
        </button>
        <button class="mode-btn" id="addnote-mode-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add Note
        </button>
        <button class="mode-btn" id="quiz-mode-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Quiz
        </button>
        <button class="mode-btn" id="progress-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Progress
        </button>
      </div>
      <div class="user-chip hidden" id="user-chip">
        <span id="user-name"></span>
        <button id="logout-btn" type="button">Log out</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- login / signup -->
  <div id="auth-screen" class="hidden">
    <div class="auth-card">
      <h2 class="auth-title" id="auth-title">Welcome back</h2>
      <p class="auth-sub" id="auth-sub">Log in to see your notes, quizzes and progress.</p>

      <div class="auth-tabs">
        <button class="mode-btn active" id="tab-login" type="button">Log in</button>
        <button class="mode-btn" id="tab-signup" type="button">Sign up</button>
      </div>

      <form id="auth-form" class="auth-card" style="max-width:none">
        <div class="field-group">
          <label class="field-label" for="auth-username">Username</label>
          <input class="auth-input" type="text" id="auth-username" autocomplete="username" autocapitalize="none" spellcheck="false">
          <p class="auth-hint hidden" id="username-hint">3 to 20 characters: letters, numbers or underscore.</p>
        </div>
        <div class="field-group">
          <label class="field-label" for="auth-password">Password</label>
          <input class="auth-input" type="password" id="auth-password" autocomplete="current-password">
          <p class="auth-hint hidden" id="password-hint">At least 8 characters, with both letters and numbers.</p>
        </div>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <button class="auth-submit" id="auth-submit" type="submit">Log in</button>
      </form>
    </div>
  </div>

  <!-- the app itself -->
  <div id="main" class="hidden">
    <div id="chat-box"></div>

    <div id="subject-row">
      <span class="field-label">Subject</span>
      <input type="text" id="subject-input" placeholder="e.g. Biology, Economics, Math" autocomplete="off">
    </div>

    <div id="quiz-options-row">
      <div class="quiz-option-field">
        <span class="field-label">Difficulty</span>
        <select id="quiz-difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="quiz-option-field">
        <span class="field-label">Questions</span>
        <select id="quiz-count">
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
      </div>
    </div>

    <form id="input-form">
      <input type="text" id="question-input" placeholder="Ask a question..." autocomplete="off">
      <button type="submit" id="send-btn">
        <span id="send-btn-label">Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chat-box");
  const input = document.getElementById("question-input");
  const subjectRow = document.getElementById("subject-row");
  const subjectInput = document.getElementById("subject-input");
  const quizOptionsRow = document.getElementById("quiz-options-row");
  const quizDifficulty = document.getElementById("quiz-difficulty");
  const quizCount = document.getElementById("quiz-count");
  const sendBtn = document.getElementById("send-btn");
  const sendBtnLabel = document.getElementById("send-btn-label");
  const form = document.getElementById("input-form");
  const chatModeBtn = document.getElementById("chat-mode-btn");
  const summarizeModeBtn = document.getElementById("summarize-mode-btn");
  const addnoteModeBtn = document.getElementById("addnote-mode-btn");
  const quizModeBtn = document.getElementById("quiz-mode-btn");
  const progressBtn = document.getElementById("progress-btn");
  const themeToggle = document.getElementById("theme-toggle");
  const themeIcon = document.getElementById("theme-icon");

  const authScreen = document.getElementById("auth-screen");
  const mainArea = document.getElementById("main");
  const modeToggle = document.getElementById("mode-toggle");
  const userChip = document.getElementById("user-chip");
  const userName = document.getElementById("user-name");
  const logoutBtn = document.getElementById("logout-btn");
  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const authForm = document.getElementById("auth-form");
  const authTitle = document.getElementById("auth-title");
  const authSub = document.getElementById("auth-sub");
  const authUsername = document.getElementById("auth-username");
  const authPassword = document.getElementById("auth-password");
  const authError = document.getElementById("auth-error");
  const authSubmit = document.getElementById("auth-submit");
  const usernameHint = document.getElementById("username-hint");
  const passwordHint = document.getElementById("password-hint");

  let mode = "chat";
  let authMode = "login";
  let chatHistory = [];
  let selectedAnswers = [];

  const EMPTY_STATE_HTML =
    '<div class="empty-state" id="empty-state">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M8 8h8M8 12h5"/></svg>' +
    '<p>Ask a question, add a note, or generate a quiz to get started.</p></div>';

  // ---------- theme ----------
  const savedTheme = localStorage.getItem("studymate-theme") || "light";
  if (savedTheme === "dark") document.body.setAttribute("data-theme", "dark");
  updateThemeIcon();

  themeToggle.addEventListener("click", () => {
    const isDark = document.body.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.body.removeAttribute("data-theme");
      localStorage.setItem("studymate-theme", "light");
    } else {
      document.body.setAttribute("data-theme", "dark");
      localStorage.setItem("studymate-theme", "dark");
    }
    updateThemeIcon();
  });

  function updateThemeIcon() {
    const isDark = document.body.getAttribute("data-theme") === "dark";
    themeIcon.innerHTML = isDark
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  }

  // ---------- talking to the server ----------
  // Every request goes through here, so an expired login sends you back to the login screen.
  async function api(url, options) {
    const response = await fetch(url, options);
    if (response.status === 401 && url !== "/login" && url !== "/signup" && url !== "/me") {
      showAuth("Your session ended. Please log in again.");
    }
    return response;
  }

  // ---------- login / signup screen ----------
  function setAuthMode(newMode) {
    authMode = newMode;
    const isSignup = newMode === "signup";
    tabLogin.classList.toggle("active", !isSignup);
    tabSignup.classList.toggle("active", isSignup);
    authTitle.textContent = isSignup ? "Create your account" : "Welcome back";
    authSub.textContent = isSignup
      ? "Your notes, quizzes and progress stay private to your account."
      : "Log in to see your notes, quizzes and progress.";
    authSubmit.textContent = isSignup ? "Create account" : "Log in";
    usernameHint.classList.toggle("hidden", !isSignup);
    passwordHint.classList.toggle("hidden", !isSignup);
    authPassword.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
    authError.textContent = "";
  }

  tabLogin.addEventListener("click", () => setAuthMode("login"));
  tabSignup.addEventListener("click", () => setAuthMode("signup"));

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = authUsername.value.trim();
    const password = authPassword.value;

    if (username === "" || password === "") {
      authError.textContent = "Enter a username and password.";
      return;
    }

    authSubmit.disabled = true;
    authError.textContent = "";
    try {
      const response = await api(authMode === "signup" ? "/signup" : "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        authError.textContent = data.error || "Something went wrong. Try again.";
      } else {
        authPassword.value = "";
        showApp(data.username);
      }
    } catch (err) {
      authError.textContent = "Couldn't reach StudyMate. Check your connection and try again.";
    } finally {
      authSubmit.disabled = false;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    try {
      await fetch("/logout", { method: "POST" });
    } catch (err) {
      // even if the request fails, show the login screen
    }
    showAuth();
  });

  function resetChat() {
    chatBox.innerHTML = EMPTY_STATE_HTML;
    chatHistory = [];
    selectedAnswers = [];
    subjectInput.value = "";
    input.value = "";
    setMode("chat");
  }

  function showAuth(message) {
    resetChat();
    mainArea.classList.add("hidden");
    modeToggle.classList.add("hidden");
    userChip.classList.add("hidden");
    authScreen.classList.remove("hidden");
    authUsername.value = "";
    authPassword.value = "";
    setAuthMode("login");
    if (message) authError.textContent = message;
    authUsername.focus();
  }

  function showApp(username) {
    resetChat();
    authScreen.classList.add("hidden");
    mainArea.classList.remove("hidden");
    modeToggle.classList.remove("hidden");
    userChip.classList.remove("hidden");
    userName.textContent = username;
  }

  async function checkLogin() {
    try {
      const response = await fetch("/me");
      if (response.ok) {
        const data = await response.json();
        showApp(data.username);
      } else {
        showAuth();
      }
    } catch (err) {
      showAuth("Couldn't reach StudyMate. Is the server running?");
    }
  }

  // ---------- modes ----------
  chatModeBtn.addEventListener("click", () => setMode("chat"));
  summarizeModeBtn.addEventListener("click", () => setMode("summarize"));
  addnoteModeBtn.addEventListener("click", () => setMode("addnote"));
  quizModeBtn.addEventListener("click", () => setMode("quiz"));
  progressBtn.addEventListener("click", () => showProgress());

  function setMode(newMode) {
    mode = newMode;
    chatModeBtn.classList.toggle("active", mode === "chat");
    summarizeModeBtn.classList.toggle("active", mode === "summarize");
    addnoteModeBtn.classList.toggle("active", mode === "addnote");
    quizModeBtn.classList.toggle("active", mode === "quiz");

    subjectRow.classList.toggle("visible", mode === "addnote" || mode === "quiz");
    quizOptionsRow.classList.toggle("visible", mode === "quiz");
    input.style.display = (mode === "quiz") ? "none" : "block";

    if (mode === "chat") input.placeholder = "Ask a question...";
    else if (mode === "summarize") input.placeholder = "Paste text to summarize...";
    else if (mode === "addnote") input.placeholder = "Paste a note to save...";

    sendBtnLabel.textContent = (mode === "quiz") ? "Generate Quiz" : "Send";
  }

  function clearEmptyState() {
    const el = document.getElementById("empty-state");
    if (el) el.remove();
  }

  function addMessage(text, role) {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "row" + (role === "user" ? " user-row" : "");
    if (role === "ai") {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "S";
      row.appendChild(avatar);
    }
    const bubble = document.createElement("div");
    bubble.className = "msg " + (role === "user" ? "user-msg" : "ai-msg");
    bubble.textContent = text;
    row.appendChild(bubble);
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addReference(noteText) {
    const div = document.createElement("div");
    div.className = "reference";
    const preview = noteText.length > 90 ? noteText.slice(0, 90) + "..." : noteText;
    div.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/></svg><span></span>';
    div.querySelector("span").textContent = "Based on your note: " + preview;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    clearEmptyState();
    const row = document.createElement("div");
    row.className = "typing-row";
    row.id = "typing-indicator";
    row.innerHTML = '<div class="avatar">S</div><div class="typing-dots"><span></span><span></span><span></span></div>';
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function renderQuiz(quiz, subject, difficulty) {
    clearEmptyState();
    selectedAnswers = new Array(quiz.questions.length);

    const card = document.createElement("div");
    card.className = "quiz-card";

    quiz.questions.forEach((q, qIndex) => {
      const qBlock = document.createElement("div");
      qBlock.className = "quiz-question";

      const qText = document.createElement("p");
      qText.className = "quiz-question-text";
      qText.textContent = (qIndex + 1) + ". " + q.question;
      qBlock.appendChild(qText);

      const optionsDiv = document.createElement("div");
      optionsDiv.className = "quiz-options";

      q.options.forEach((opt) => {
        const optBtn = document.createElement("button");
        optBtn.type = "button";
        optBtn.className = "quiz-option";
        optBtn.textContent = opt;
        optBtn.addEventListener("click", () => {
          optionsDiv.querySelectorAll(".quiz-option").forEach(o => o.classList.remove("selected"));
          optBtn.classList.add("selected");
          selectedAnswers[qIndex] = opt;
        });
        optionsDiv.appendChild(optBtn);
      });

      qBlock.appendChild(optionsDiv);
      card.appendChild(qBlock);
    });

    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "quiz-submit-btn";
    submitBtn.textContent = "Submit Answers";
    submitBtn.addEventListener("click", async () => {
      if (selectedAnswers.includes(undefined)) {
        alert("Please answer every question before submitting.");
        return;
      }
      const response = await api("/submit_quiz", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questions: quiz.questions, user_answers: selectedAnswers, subject: subject, difficulty: difficulty })
      });
      const result = await response.json();

      if (result.error) {
        alert(result.error);
        return;
      }

      card.querySelectorAll(".quiz-question").forEach((block, i) => {
        block.querySelectorAll(".quiz-option").forEach(opt => {
          opt.disabled = true;
          if (opt.textContent === quiz.questions[i].correct_answer) opt.classList.add("correct");
          else if (opt.classList.contains("selected")) opt.classList.add("incorrect");
        });
      });

      const scoreDiv = document.createElement("div");
      scoreDiv.className = "quiz-score";
      scoreDiv.textContent = "Score: " + result.score + " / " + result.total;
      card.appendChild(scoreDiv);
      submitBtn.remove();
    });
    card.appendChild(submitBtn);

    chatBox.appendChild(card);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function renderProgress(topics) {
    clearEmptyState();
    const card = document.createElement("div");
    card.className = "progress-card";

    const title = document.createElement("p");
    title.className = "progress-title";
    title.textContent = "Your progress by subject";
    card.appendChild(title);

    const hint = document.createElement("p");
    hint.className = "progress-hint";
    hint.textContent = "Predicted chance of answering correctly. Weakest subjects come first.";
    card.appendChild(hint);

    topics.forEach((t) => {
      const percent = Math.round(t.chance_correct * 100);
      let level = "strong";
      let status = "Strong";
      if (percent < 50) { level = "weak"; status = "Needs work"; }
      else if (percent < 70) { level = "okay"; status = "Getting there"; }

      const item = document.createElement("div");

      const top = document.createElement("div");
      top.className = "progress-item-top";
      const name = document.createElement("span");
      name.className = "progress-subject";
      name.textContent = t.subject;
      const pct = document.createElement("span");
      pct.className = "progress-percent";
      pct.textContent = percent + "%";
      top.appendChild(name);
      top.appendChild(pct);

      const track = document.createElement("div");
      track.className = "progress-track";
      const fill = document.createElement("div");
      fill.className = "progress-fill " + level;
      track.appendChild(fill);

      const statusEl = document.createElement("div");
      statusEl.className = "progress-status";
      statusEl.textContent = status;

      item.appendChild(top);
      item.appendChild(track);
      item.appendChild(statusEl);
      card.appendChild(item);

      setTimeout(() => { fill.style.width = percent + "%"; }, 50);
    });

    chatBox.appendChild(card);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function showProgress() {
    showTyping();
    try {
      const response = await api("/weak_topics");
      const data = await response.json();
      hideTyping();
      if (data.error) addMessage(data.error, "ai");
      else renderProgress(data.topics);
    } catch (err) {
      hideTyping();
      addMessage("Couldn't reach StudyMate. Check your connection and try again.", "ai");
    }
  }

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    if (mode === "quiz") {
      const subject = subjectInput.value.trim();
      if (subject === "") { alert("Please enter a subject."); return; }
      const difficulty = quizDifficulty.value;
      const numQuestions = parseInt(quizCount.value);

      addMessage("Generate a " + numQuestions + "-question " + difficulty + " quiz on " + subject, "user");
      sendBtn.disabled = true;
      showTyping();
      try {
        const response = await api("/generate_quiz", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subject: subject, difficulty: difficulty, num_questions: numQuestions })
        });
        const quiz = await response.json();
        hideTyping();
        if (quiz.error) addMessage(quiz.error, "ai");
        else renderQuiz(quiz, subject, difficulty);
      } catch (err) {
        hideTyping();
        addMessage("Couldn't reach StudyMate. Check your connection and try again.", "ai");
      } finally {
        sendBtn.disabled = false;
      }
      return;
    }

    const text = input.value.trim();
    if (text === "") return;

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      if (mode === "chat") {
        chatHistory.push({ role: "user", parts: [{ text: text }] });
        const response = await api("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: chatHistory })
        });
        const data = await response.json();
        hideTyping();
        if (data.error) {
          chatHistory.pop();
          addMessage(data.error, "ai");
        } else {
          addMessage(data.answer, "ai");
          if (data.used_note) addReference(data.used_note);
          chatHistory.push({ role: "model", parts: [{ text: data.answer }] });
        }
      } else if (mode === "summarize") {
        const response = await api("/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });
        const data = await response.json();
        hideTyping();
        addMessage(data.error ? data.error : data.summary, "ai");
      } else {
        const subject = subjectInput.value.trim() || "General";
        const response = await api("/add_note", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, subject: subject })
        });
        const data = await response.json();
        hideTyping();
        if (data.error) {
          addMessage(data.error, "ai");
        } else {
          addMessage('Note saved under "' + subject + '". StudyMate can now use it to answer questions.', "ai");
          subjectInput.value = "";
        }
      }
    } catch (err) {
      hideTyping();
      addMessage("Couldn't reach StudyMate. Check your connection and try again.", "ai");
    } finally {
      sendBtn.disabled = false;
    }
  });

  // ---------- start ----------
  resetChat();
  checkLogin();
</script>
</body>
</html>
